<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Commercial App Portal</title>
    <!-- We use Bootstrap to make the website instantly look professional and clean -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/style.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .card { border: none; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
    </style>
</head>
<body>

<div class="card p-4">
    <h3 class="text-center mb-4 text-primary">Create Your Account</h3>
    
    <!-- Registration Input Fields -->
    <div class="mb-3">
        <label class="form-label">Username</label>
        <input type="text" id="username" class="form-control" placeholder="e.g. john_doe">
    </div>
    <div class="mb-3">
        <label class="form-label">Email Address</label>
        <input type="email" id="email" class="form-control" placeholder="name@example.com">
    </div>
    <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" id="password" class="form-control" placeholder="••••••••">
    </div>
    
    <button onclick="submitData()" class="btn btn-primary w-100 mt-2">Register Now</button>
    <div id="responseMessage" class="mt-3 text-center smallfw-bold"></div>
</div>

<script>
// This Javascript function grabs the input text and sends it to our Python server
async function submitData() {
    const usernameInput = document.getElementById('username').value;
    const emailInput = document.getElementById('email').value;
    const passwordInput = document.getElementById('password').value;
    const messageDiv = document.getElementById('responseMessage');

    messageDiv.innerText = "Processing...";
    messageDiv.className = "mt-3 text-center small text-secondary";

    // Packing the fields into a JSON block, identical to our curl test!
    const response = await fetch('/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: usernameInput, email: emailInput, password: passwordInput })
    });

    const result = await response.get_json ? await response.json() : await response.json();
    
    if (response.status === 201) {
        messageDiv.innerText = result.message;
        messageDiv.className = "mt-3 text-center small text-success";
    } else {
        messageDiv.innerText = result.message;
        messageDiv.className = "mt-3 text-center small text-danger";
    }
}
</script>

</body>
</html>
