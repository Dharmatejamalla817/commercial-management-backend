<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Situational UI Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/style.min.css" rel="stylesheet">
    <style>
        body { 
            transition: background-color 0.5s ease; 
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .situational-card {
            border: none;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 500px;
            transition: all 0.3s ease;
        }
    </style>
</head>
<body>

<!-- Simulation Controller (For testing the states manually) -->
<div class="mb-4 text-center">
    <small class="text-secondary d-block mb-2">Simulate UI Context States:</small>
    <div class="btn-group" role="group">
        <button type="button" class="btn btn-outline-primary btn-sm" onclick="changeSituation('morning')">☀️ Morning Agenda</button>
        <button type="button" class="btn btn-outline-danger btn-sm" onclick="changeSituation('crisis')">🚨 Operational Crisis</button>
        <button type="button" class="btn btn-outline-dark btn-sm" onclick="changeSituation('evening')">🌙 Off-Hours Mode</button>
    </div>
</div>

<!-- Dynamic Situational Card Container -->
<div id="uiFrame" class="card situational-card p-4">
    <!-- Content dynamically injected here by Javascript -->
</div>

<script>
function changeSituation(state) {
    const frame = document.getElementById('uiFrame');
    const body = document.body;

    if (state === 'morning') {
        body.style.backgroundColor = "#eef2f7";
        frame.innerHTML = `
            <div class="d-flex align-items-center mb-3">
                <span class="fs-2 me-2">☀️</span>
                <div>
                    <h4 class="mb-0 text-darkfw-bold">Morning Rush Protocol</h4>
                    <small class="text-muted">Today's Active Operations</small>
                </div>
            </div>
            <hr>
            <div class="p-3 bg-white border rounded mb-2">
                <strong>09:00 AM</strong> - Premium Client Check-in
            </div>
            <div class="p-3 bg-white border rounded mb-3">
                <strong>11:30 AM</strong> - Inventory Supply Delivery
            </div>
            <button class="btn btn-primary w-100">Launch Daily Workspace</button>
        `;
    } 
    
    else if (state === 'crisis') {
        body.style.backgroundColor = "#fdf2f2";
        frame.innerHTML = `
            <div class="d-flex align-items-center mb-3 text-danger">
                <span class="fs-2 me-2">🚨</span>
                <div>
                    <h4 class="mb-0 fw-bold">System Overlap Detected</h4>
                    <small class="text-danger-emphasis">Action required immediately</small>
                </div>
            </div>
            <div class="alert alert-danger py-2 px-3 small">
                Two critical client appointments have been booked simultaneously at 2:00 PM.
            </div>
            <button class="btn btn-danger w-100 mb-2">Reschedule Conflicted User</button>
            <button class="btn btn-outline-secondary w-100 btn-sm">Dismiss Alert</button>
        `;
    } 
    
    else if (state === 'evening') {
        body.style.backgroundColor = "#1e293b";
        frame.innerHTML = `
            <div class="d-flex align-items-center mb-3 text-white">
                <span class="fs-2 me-2">🌙</span>
                <div>
                    <h4 class="mb-0 text-slate-200">Operations Suspended</h4>
                    <small class="text-muted">EOD Analytics Summary</small>
                </div>
            </div>
            <div class="row text-center my-3">
                <div class="col text-white">
                    <h3 class="fw-bold text-success">$1,240</h3>
                    <small class="text-muted">Gross Profit</small>
                </div>
                <div class="col text-white">
                    <h3 class="fw-bold text-info">14</h3>
                    <small class="text-muted">Completed Tasks</small>
                </div>
            </div>
            <button class="btn btn-dark border-secondary text-secondary w-100 btn-sm">Lock Console & Sign Out</button>
        `;
    }
}

// Default layout initialization on page load
// Automatically fetch the live situation from our Python backend on page load
window.onload = async function() {
    try {
        const response = await fetch('/get-status');
        const data = await response.json();
        
        // Pass the backend's decision straight into our UI morphing function!
        changeSituation(data.situation);
    } catch (error) {
        console.error("Failed to fetch live operational status:", error);
        changeSituation('morning'); // Fallback default
    }
};
</script>

</body>
</html>
