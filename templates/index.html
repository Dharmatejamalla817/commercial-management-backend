<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zero-Knowledge Guest Mode Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/style.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .app-container { width: 100%; max-width: 500px; }
        .card { border: none; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
    </style>
</head>
<body>

<div class="app-container">
    <!-- Part 1: Interactive Guest Workspace -->
    <div class="card p-4 mb-4 bg-white">
        <h5 class="fw-bold text-dark mb-1">⚡ Instant Guest Workspace</h5>
        <p class="text-muted small">Configure your business preference instantly. No account required yet.</p>
        
        <div class="mb-3">
            <label class="form-label small fw-semibold">Select Application Blueprint</label>
            <select id="blueprintSelection" class="form-select" onchange="updateGuestMemory()">
                <option value="High-Margin Retail Console">High-Margin Retail Console</option>
                <option value="Hyper-Local Logistics Routing">Hyper-Local Logistics Routing</option>
                <option value="Automated Appointment Registry">Automated Appointment Registry</option>
            </select>
        </div>
        <div class="p-3 bg-light rounded text-secondary small">
            💾 Live Session Cache: <span id="cacheStatus" class="text-primary fw-bold">Default Blueprint</span>
        </div>
    </div>

    <!-- Part 2: Structural Account Finalization -->
    <div class="card p-4">
        <h5 class="fw-bold text-primary mb-3">Save Your Environment</h5>
        <div class="mb-3">
            <label class="form-label small">Choose Username</label>
            <input type="text" id="username" class="form-control" placeholder="e.g. founder1">
        </div>
        <div class="mb-3">
            <label class="form-label small">Email Address</label>
            <input type="email" id="email" class="form-control" placeholder="name@domain.com">
        </div>
        <div class="mb-3">
            <label class="form-label small">Security Password</label>
            <input type="password" id="password" class="form-control" placeholder="••••••••">
        </div>
        
        <button onclick="finalizeAccount()" class="btn btn-success w-100 mt-2">Claim This Work & Register</button>
        <div id="responseMessage" class="mt-3 text-center small fw-bold"></div>
    </div>
</div>

<script>
// 1. Silently monitor and store the guest configuration choices into browser memory
function updateGuestMemory() {
    const selectedValue = document.getElementById('blueprintSelection').value;
    sessionStorage.setItem('tempGuestAction', selectedValue);
    document.getElementById('cacheStatus').innerText = selectedValue;
}

// Initialize default choice on window load
window.onload = function() {
    updateGuestMemory();
};

// 2. Package credentials alongside temporary guest logs and ship them to Flask
async function finalizeAccount() {
    const usernameInput = document.getElementById('username').value;
    const emailInput = document.getElementById('email').value;
    const passwordInput = document.getElementById('password').value;
    const currentGuestData = sessionStorage.getItem('tempGuestAction') || "None";
    const messageDiv = document.getElementById('responseMessage');

    messageDiv.innerText = "Processing checkout...";
    messageDiv.className = "mt-3 text-center small text-secondary";

    const response = await fetch('/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ 
            username: usernameInput, 
            email: emailInput, 
            password: passwordInput,
            guestData: currentGuestData // The secret ingredient!
        })
    });

    const result = await response.json();
    
    if (response.status === 201) {
        messageDiv.innerText = result.message;
        messageDiv.className = "mt-3 text-center small text-success";
        sessionStorage.clear(); // Wipe guest storage clean upon success
    } else {
        messageDiv.innerText = result.message;
        messageDiv.className = "mt-3 text-center small text-danger";
    }
}
</script>

</body>
</html>
